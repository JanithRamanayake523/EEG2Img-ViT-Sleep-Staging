[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepvit"
version = "0.1.0"
description = "Sleep stage classification with Vision Transformers using EEG/PSG image transformations and DCGAN augmentation"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "scikit-image",
    "matplotlib",
    "seaborn",
    "pillow",
    "pyyaml",
    "tqdm",
    "mne",
    "pyts",
    "PyWavelets",
    "torch",
    "torchvision",
    "timm",
    "torchmetrics",
    "torch-fidelity",
    "tabulate",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
